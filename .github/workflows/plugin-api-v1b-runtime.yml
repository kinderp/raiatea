name: Plugin API v1b runtime contract

on:
  pull_request:
    paths:
      - "elaboration/p0/contracts/plugins/runtime/**"
      - ".github/workflows/plugin-api-v1b-runtime.yml"
  push:
    branches: [main]
    paths:
      - "elaboration/p0/contracts/plugins/runtime/**"
      - ".github/workflows/plugin-api-v1b-runtime.yml"

permissions:
  contents: read

jobs:
  semantic:
    name: Plugin runtime semantic conformance / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile runtime contract tooling
        run: python -m compileall -q elaboration/p0/contracts/plugins/runtime/1.0.0
      - name: Run semantic tests
        run: |
          python elaboration/p0/contracts/plugins/runtime/1.0.0/test_runtime.py -v
          python elaboration/p0/contracts/plugins/runtime/1.0.0/test_runtime_handle_bounds.py -v

  json-schema-reference:
    name: Plugin runtime JSON Schema reference validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"
      - name: Validate runtime schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          path = Path("elaboration/p0/contracts/plugins/runtime/1.0.0/runtime-contract.schema.json")
          schema = json.loads(path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          print("PASS runtime schema")
          PY
