name: PDF1c Docling product contracts

on:
  pull_request:
    paths:
      - "prototype/p0_vs1/**"
      - "elaboration/p0/benchmark/locks/docling-2.118.0-python312-linux-x86_64.txt"
      - "elaboration/p0/benchmark/locks/docling-2.118.0-layout-model-payload.json"
      - "elaboration/p0/contracts/plugins/**"
      - "elaboration/p0/contracts/extraction/0.1.0/**"
      - ".github/workflows/pdf1c-docling-contract.yml"
  push:
    branches: [main]
    paths:
      - "prototype/p0_vs1/**"
      - ".github/workflows/pdf1c-docling-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    name: PDF1c contracts / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile PDF1c product contracts
        run: >-
          python -m compileall -q
          prototype/p0_vs1/docling_observation_contract.py
          prototype/p0_vs1/docling_reference.py
          prototype/p0_vs1/docling_product_parser.py
          prototype/p0_vs1/docling_provider_runtime.py
          prototype/p0_vs1/docling_process_environment.py
          prototype/p0_vs1/docling_e05_adapter.py
          prototype/p0_vs1/pdf1c_e05_contract.py
          prototype/p0_vs1/pdf1c_rights.py
          prototype/p0_vs1/pdf1c_service.py
          prototype/p0_vs1/plugins/docling_pdf
          prototype/p0_vs1/test_pdf1c_contract.py
          prototype/p0_vs1/test_pdf1c_reference.py
          prototype/p0_vs1/test_pdf1c_parser.py
          prototype/p0_vs1/test_pdf1c_surface_policy.py
          prototype/p0_vs1/test_pdf1c_provider_runtime.py
          prototype/p0_vs1/test_pdf1c_process.py
          prototype/p0_vs1/test_pdf1c_e05.py
          prototype/p0_vs1/test_pdf1c_rights.py
          prototype/p0_vs1/test_pdf1c_service.py
      - name: Validate Docling plugin manifest
        run: python elaboration/p0/contracts/plugins/1.0.0/validate_manifest.py prototype/p0_vs1/plugins/docling_pdf/manifest.json
      - name: Run PDF1c observation contract tests
        run: python -m unittest prototype.p0_vs1.test_pdf1c_contract -v
      - name: Run PDF1c reference-gate tests
        run: python -m unittest prototype.p0_vs1.test_pdf1c_reference -v
      - name: Run PDF1c product parser tests
        run: python -m unittest prototype.p0_vs1.test_pdf1c_parser -v
      - name: Run PDF1c surface-policy tests
        run: python -m unittest prototype.p0_vs1.test_pdf1c_surface_policy -v
      - name: Run PDF1c provider-result classification tests
        run: python -m unittest prototype.p0_vs1.test_pdf1c_provider_runtime -v
      - name: Run PDF1c process/environment tests
        run: python -m unittest prototype.p0_vs1.test_pdf1c_process -v
      - name: Run PDF1c E-05 tests
        run: python -m unittest prototype.p0_vs1.test_pdf1c_e05 -v
      - name: Run PDF1c rights tests
        run: python -m unittest prototype.p0_vs1.test_pdf1c_rights -v
      - name: Run PDF1c Core service/fence tests
        run: python -m unittest prototype.p0_vs1.test_pdf1c_service -v
      - name: Re-run accepted E-05 semantic validator
        run: python elaboration/p0/contracts/extraction/0.1.0/test_contract.py -v
      - name: Re-run accepted process environment regression
        run: python -m unittest prototype.p0_vs1.test_vs1c_environment -v
