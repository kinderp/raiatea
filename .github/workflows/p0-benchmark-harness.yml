name: P0 benchmark harness

on:
  pull_request:
    paths:
      - "elaboration/p0/benchmark/**"
      - ".github/workflows/p0-benchmark-harness.yml"
  push:
    branches:
      - main
    paths:
      - "elaboration/p0/benchmark/**"
      - ".github/workflows/p0-benchmark-harness.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile benchmark tooling
        shell: bash
        run: python -m compileall -q elaboration/p0/benchmark

      - name: Run benchmark harness tests
        shell: bash
        run: python -m unittest discover -s elaboration/p0/benchmark/tests -v

      - name: Generate deterministic fixture set
        shell: bash
        run: |
          python elaboration/p0/benchmark/generate_fixtures.py \
            --output "${RUNNER_TEMP}/raiatea-p0-fixtures" > "${RUNNER_TEMP}/raiatea-p0-generated-manifest.txt"
          test -s "${RUNNER_TEMP}/raiatea-p0-fixtures/generated-manifest.json"

  b01-poppler-reference:
    name: B-01 Poppler reference / Ubuntu 24.04
    needs: test
    runs-on: ubuntu-24.04
    env:
      EVIDENCE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_POPPLER_VERSION: "24.02.0"
      EXPECTED_PDFTOTEXT_SHA256: "0fb98ea179e19154a90202608c164f2a319b79f16576fa6534b2d601033565e7"
      EXPECTED_PDFTOHTML_SHA256: "70bd5fbb655a14d0b02cb32cb53a601d3b0842a63553a24d1a6a612cf9f0624e"
      EXPECTED_PDFINFO_SHA256: "3293dda06d80e1e38dab859aa47368c2876aedc41cbc2e24e8fb9a4e66392078"

    steps:
      - name: Check out exact evidence source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SOURCE_COMMIT }}

      - name: Verify evidence source checkout
        run: |
          test "$(git rev-parse HEAD)" = "${EVIDENCE_SOURCE_COMMIT}"
          echo "Evidence source commit: ${EVIDENCE_SOURCE_COMMIT}"

      - name: Set up exact reference Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install and verify exact Poppler controls
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

          pdftotext -v 2>&1 | head -1 | grep -F "version ${EXPECTED_POPPLER_VERSION}"
          pdftohtml -v 2>&1 | head -1 | grep -F "version ${EXPECTED_POPPLER_VERSION}"
          pdfinfo -v 2>&1 | head -1 | grep -F "version ${EXPECTED_POPPLER_VERSION}"

          echo "${EXPECTED_PDFTOTEXT_SHA256}  /usr/bin/pdftotext" | sha256sum -c -
          echo "${EXPECTED_PDFTOHTML_SHA256}  /usr/bin/pdftohtml" | sha256sum -c -
          echo "${EXPECTED_PDFINFO_SHA256}  /usr/bin/pdfinfo" | sha256sum -c -

      - name: Run B-01 reference baseline
        run: |
          mkdir -p "${RUNNER_TEMP}/raiatea-b01-reference"
          python elaboration/p0/benchmark/routes/measure_b01.py \
            --output "${RUNNER_TEMP}/raiatea-b01-reference" \
            --evidence-source-commit "${EVIDENCE_SOURCE_COMMIT}" \
            > "${RUNNER_TEMP}/raiatea-b01-reference/stdout-report.json"
          test -s "${RUNNER_TEMP}/raiatea-b01-reference/b01-results.json"
          test -s "${RUNNER_TEMP}/raiatea-b01-reference/b01-summary.md"

      - name: Upload B-01 reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-b01-poppler-reference-${{ env.EVIDENCE_SOURCE_COMMIT }}
          path: ${{ runner.temp }}/raiatea-b01-reference
          if-no-files-found: error
          retention-days: 7

  b01-tika-reference:
    name: B-01 Tika 3.3.2 reference / Ubuntu 24.04
    needs: test
    runs-on: ubuntu-24.04
    env:
      EVIDENCE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      TIKA_VERSION: "3.3.2"
      TIKA_SHA512: "88c2032cba0d45feea361e6eebd2918bd04707614cdda5d89a1b167da5503c98e7b4cd368336f0402d559abcaf5006fcc7c825c32c749ae0417ea2f3b8423aba"
      TIKA_URL: "https://downloads.apache.org/tika/3.3.2/tika-app-3.3.2.jar"
      EXPECTED_JAVA_SHA256: "11af352aa2c506c4123a4e4c19c187d59e06cd0dff317d54f5e6806e07c6715d"

    steps:
      - name: Check out exact evidence source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SOURCE_COMMIT }}

      - name: Verify evidence source checkout
        run: |
          test "$(git rev-parse HEAD)" = "${EVIDENCE_SOURCE_COMMIT}"
          echo "Evidence source commit: ${EVIDENCE_SOURCE_COMMIT}"

      - name: Set up reference Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Set up exact reference Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.12+8"

      - name: Verify exact Java runtime
        run: |
          java -version 2>&1 | head -1 | grep -F '21.0.12'
          JAVA_BIN="$(command -v java)"
          echo "${EXPECTED_JAVA_SHA256}  ${JAVA_BIN}" | sha256sum -c -

      - name: Download and verify official Tika app
        run: |
          mkdir -p "${RUNNER_TEMP}/raiatea-tika"
          curl --fail --location --retry 3 --retry-delay 2 \
            "${TIKA_URL}" \
            --output "${RUNNER_TEMP}/raiatea-tika/tika-app-${TIKA_VERSION}.jar"
          echo "${TIKA_SHA512}  ${RUNNER_TEMP}/raiatea-tika/tika-app-${TIKA_VERSION}.jar" | sha512sum -c -
          java -jar "${RUNNER_TEMP}/raiatea-tika/tika-app-${TIKA_VERSION}.jar" -V 2>&1 | tee "${RUNNER_TEMP}/raiatea-tika/tika-version.txt"
          grep -F "${TIKA_VERSION}" "${RUNNER_TEMP}/raiatea-tika/tika-version.txt"

      - name: Run Tika B-01 reference baseline
        run: |
          mkdir -p "${RUNNER_TEMP}/raiatea-tika-reference"
          python elaboration/p0/benchmark/routes/measure_tika_b01.py \
            --output "${RUNNER_TEMP}/raiatea-tika-reference" \
            --tika-jar "${RUNNER_TEMP}/raiatea-tika/tika-app-${TIKA_VERSION}.jar" \
            --config elaboration/p0/benchmark/config/tika-pdf-native-no-ocr.xml \
            --evidence-source-commit "${EVIDENCE_SOURCE_COMMIT}" \
            > "${RUNNER_TEMP}/raiatea-tika-reference/stdout-report.json"
          test -s "${RUNNER_TEMP}/raiatea-tika-reference/tika-b01-results.json"
          test -s "${RUNNER_TEMP}/raiatea-tika-reference/tika-b01-summary.md"

      - name: Upload Tika B-01 reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-b01-tika-${{ env.TIKA_VERSION }}-${{ env.EVIDENCE_SOURCE_COMMIT }}
          path: |
            ${{ runner.temp }}/raiatea-tika-reference
            ${{ runner.temp }}/raiatea-tika/tika-version.txt
          if-no-files-found: error
          retention-days: 7

  b01-docling-reference:
    name: B-01 Docling 2.118.0 reference / Ubuntu 24.04
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EVIDENCE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      DOCLING_VERSION: "2.118.0"
      DOCLING_WHEEL_SHA256: "fd4962c9a54229bae1eb9b49f7fadb7e7b8affabf7e4fba1aac8cb335f558c8f"
      DOCLING_CONSTRAINTS: "elaboration/p0/benchmark/locks/docling-2.118.0-python312-linux-x86_64.txt"
      DOCLING_MODEL_LOCK: "elaboration/p0/benchmark/locks/docling-2.118.0-layout-model-payload.json"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out exact evidence source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SOURCE_COMMIT }}

      - name: Verify evidence source checkout
        run: |
          test "$(git rev-parse HEAD)" = "${EVIDENCE_SOURCE_COMMIT}"
          echo "Evidence source commit: ${EVIDENCE_SOURCE_COMMIT}"

      - name: Set up exact reference Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Create isolated Docling environment
        run: |
          python -m venv "${RUNNER_TEMP}/docling-venv"
          "${RUNNER_TEMP}/docling-venv/bin/python" -m pip --version | tee "${RUNNER_TEMP}/docling-pip-version.txt"

      - name: Download and verify Docling wheel
        run: |
          mkdir -p "${RUNNER_TEMP}/docling-wheel"
          "${RUNNER_TEMP}/docling-venv/bin/python" -m pip download \
            --no-deps \
            --only-binary=:all: \
            --dest "${RUNNER_TEMP}/docling-wheel" \
            "docling==${DOCLING_VERSION}"
          WHEEL="$(find "${RUNNER_TEMP}/docling-wheel" -maxdepth 1 -type f -name 'docling-*.whl' -print -quit)"
          test -n "${WHEEL}"
          echo "${DOCLING_WHEEL_SHA256}  ${WHEEL}" | sha256sum -c -
          echo "DOCLING_WHEEL=${WHEEL}" >> "${GITHUB_ENV}"

      - name: Install pinned Docling environment
        run: |
          "${RUNNER_TEMP}/docling-venv/bin/python" -m pip install \
            --constraint "${DOCLING_CONSTRAINTS}" \
            "${DOCLING_WHEEL}"
          "${RUNNER_TEMP}/docling-venv/bin/python" -m pip check
          "${RUNNER_TEMP}/docling-venv/bin/python" -c 'import importlib.metadata as m; assert m.version("docling") == "2.118.0"; print(m.version("docling"))'
          "${RUNNER_TEMP}/docling-venv/bin/python" -m pip freeze --all | sort > "${RUNNER_TEMP}/docling-freeze.txt"
          sha256sum "${RUNNER_TEMP}/docling-freeze.txt" | tee "${RUNNER_TEMP}/docling-freeze.sha256"

      - name: Prefetch pinned layout model payload
        run: |
          mkdir -p "${RUNNER_TEMP}/docling-models"
          "${RUNNER_TEMP}/docling-venv/bin/docling-tools" models download \
            --quiet \
            --output-dir "${RUNNER_TEMP}/docling-models" \
            layout \
            | tee "${RUNNER_TEMP}/docling-model-download.txt"
          test -n "$(find "${RUNNER_TEMP}/docling-models" -type f -print -quit)"

      - name: Verify environment and model payload locks
        run: |
          "${RUNNER_TEMP}/docling-venv/bin/python" elaboration/p0/benchmark/routes/verify_docling_reference.py \
            --constraints "${DOCLING_CONSTRAINTS}" \
            --model-lock "${DOCLING_MODEL_LOCK}" \
            --artifacts-path "${RUNNER_TEMP}/docling-models" \
            --output "${RUNNER_TEMP}/docling-reference-verification.json"
          test -s "${RUNNER_TEMP}/docling-reference-verification.json"

      - name: Run measured Docling phase offline
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
        run: |
          mkdir -p "${RUNNER_TEMP}/raiatea-docling-reference" "${RUNNER_TEMP}/docling-measured-cache"
          "${RUNNER_TEMP}/docling-venv/bin/python" elaboration/p0/benchmark/routes/measure_docling_b01.py \
            --output "${RUNNER_TEMP}/raiatea-docling-reference" \
            --artifacts-path "${RUNNER_TEMP}/docling-models" \
            --cache-root "${RUNNER_TEMP}/docling-measured-cache" \
            --evidence-source-commit "${EVIDENCE_SOURCE_COMMIT}" \
            > "${RUNNER_TEMP}/raiatea-docling-reference/stdout-report.json"
          test -s "${RUNNER_TEMP}/raiatea-docling-reference/docling-b01-results.json"
          test -s "${RUNNER_TEMP}/raiatea-docling-reference/docling-b01-summary.md"
          test -s "${RUNNER_TEMP}/raiatea-docling-reference/docling-model-manifest.json"
          test -s "${RUNNER_TEMP}/raiatea-docling-reference/python-environment-freeze.txt"

      - name: Upload Docling reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-b01-docling-${{ env.DOCLING_VERSION }}-${{ env.EVIDENCE_SOURCE_COMMIT }}
          path: |
            ${{ runner.temp }}/raiatea-docling-reference
            ${{ runner.temp }}/docling-reference-verification.json
            ${{ runner.temp }}/docling-freeze.txt
            ${{ runner.temp }}/docling-freeze.sha256
            ${{ runner.temp }}/docling-pip-version.txt
            ${{ runner.temp }}/docling-model-download.txt
          if-no-files-found: warn
          retention-days: 7
