name: Tauri live desktop demo

on:
  pull_request:
    paths:
      - "prototype/p0_vs1/gui_demo_bootstrap.py"
      - "prototype/p0_vs1/gui_demo_prepare.py"
      - "prototype/p0_vs1/test_gui_demo_bootstrap.py"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/.env.tauri"
      - "frontend/vite.config.ts"
      - "frontend/src/gateway/**"
      - "frontend/src/ui/App.tsx"
      - "frontend/src-tauri/**"
      - ".github/workflows/tauri-live-demo.yml"
  push:
    branches: [main]
    paths:
      - "prototype/p0_vs1/gui_demo_bootstrap.py"
      - "prototype/p0_vs1/gui_demo_prepare.py"
      - "prototype/p0_vs1/test_gui_demo_bootstrap.py"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/.env.tauri"
      - "frontend/vite.config.ts"
      - "frontend/src/gateway/**"
      - "frontend/src/ui/App.tsx"
      - "frontend/src-tauri/**"
      - ".github/workflows/tauri-live-demo.yml"

permissions:
  contents: read

jobs:
  demo-bootstrap:
    name: Demo bootstrap / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile demo bootstrap
        run: python -m compileall -q prototype/p0_vs1
      - name: Test disposable live demo state
        run: python -m unittest prototype.p0_vs1.test_gui_demo_bootstrap -v

  renderer:
    name: Existing renderer + Tauri transport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install committed renderer dependencies
        working-directory: frontend
        run: npm ci
      - name: Strict TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Run renderer and transport tests
        working-directory: frontend
        run: npm test
      - name: Build browser renderer
        working-directory: frontend
        run: npm run build
      - name: Build live Tauri renderer mode
        working-directory: frontend
        run: npm run build:tauri

  desktop-core:
    name: Desktop Core / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Resolve Rust dependency graph
        working-directory: frontend/src-tauri
        run: cargo generate-lockfile
      - name: Verify exact Rust lock evidence
        run: python -c "import hashlib,json,pathlib; root=pathlib.Path('frontend/src-tauri'); expected=json.loads((root/'lock-evidence.json').read_text())['cargo_lock_sha256']; actual=hashlib.sha256((root/'Cargo.lock').read_bytes()).hexdigest(); print('Cargo.lock sha256',actual); assert actual == expected, f'cargo-lock-drift:{actual}'"
      - name: Test bounded Desktop Core
        working-directory: frontend/src-tauri
        run: cargo test --locked
      - name: Bootstrap real Raiatea demo state
        run: python -m prototype.p0_vs1.gui_demo_bootstrap
      - name: Smoke Rust managed Python ApplicationFacade chain
        working-directory: frontend/src-tauri
        run: cargo test --locked live_sidecar_smoke -- --ignored --nocapture
      - name: Check desktop application crate
        working-directory: frontend/src-tauri
        run: cargo check --locked

  documented-macos-flow:
    name: Documented local flow / macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact Tauri CLI used by the local instructions
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Run the documented preparation command
        run: python -m prototype.p0_vs1.gui_demo_prepare
      - name: Verify Tauri project discovery
        working-directory: frontend
        run: cargo tauri info
      - name: Build the live desktop application without bundling
        working-directory: frontend
        run: cargo tauri build --no-bundle --ci
