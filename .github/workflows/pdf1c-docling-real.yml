name: PDF1c real pinned Docling product acceptance

on:
  pull_request:
    paths:
      - "prototype/p0_vs1/**"
      - ".github/workflows/pdf1c-docling-real.yml"
  push:
    branches: [main]
    paths:
      - "prototype/p0_vs1/**"
      - ".github/workflows/pdf1c-docling-real.yml"

permissions:
  contents: read

jobs:
  real-docling:
    name: PDF1c real Docling / Ubuntu 24.04 / Python 3.12.14
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Confirm real-runner materialization
        shell: bash
        run: |
          set -euo pipefail
          python --version
          echo "RUNNER_TEMP=$RUNNER_TEMP"
