[package]
name = "raiatea-desktop"
version = "0.1.0"
description = "Raiatea live desktop demo shell"
authors = ["Raiatea contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "raiatea_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
