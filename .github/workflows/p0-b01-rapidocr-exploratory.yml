name: P0 B-01 RapidOCR exploratory profile

on:
  pull_request:
    paths:
      - "elaboration/p0/benchmark/**"
      - ".github/workflows/p0-b01-rapidocr-exploratory.yml"
  push:
    branches: [main]
    paths:
      - "elaboration/p0/benchmark/**"
      - ".github/workflows/p0-b01-rapidocr-exploratory.yml"

permissions:
  contents: read

jobs:
  docling-rapidocr-exploratory:
    name: B01-PDF-007 Docling + RapidOCR exploratory / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EVIDENCE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      DOCLING_VERSION: "2.118.0"
      DOCLING_WHEEL_SHA256: "fd4962c9a54229bae1eb9b49f7fadb7e7b8affabf7e4fba1aac8cb335f558c8f"
      DOCLING_CONSTRAINTS: "elaboration/p0/benchmark/locks/docling-2.118.0-python312-linux-x86_64.txt"
      DOCLING_MODEL_LOCK: "elaboration/p0/benchmark/locks/docling-2.118.0-layout-model-payload.json"
      RAPIDOCR_VERSION: "3.9.2"
      RAPIDOCR_DET_URL: "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/torch/PP-OCRv4/det/en_PP-OCRv3_det_mobile.pth"
      RAPIDOCR_DET_SHA256: "62aba369c8245f131bb08348a7d9c3135234d5c139ec92b34c8ac7b9ba7c2846"
      RAPIDOCR_REC_URL: "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/torch/PP-OCRv4/rec/en_PP-OCRv4_rec_mobile.pth"
      RAPIDOCR_REC_SHA256: "f9723c94847de59df9b059faaed041fbb35f014ea973da40290b1e97004e1d4e"
      RAPIDOCR_DICT_URL: "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/paddle/PP-OCRv4/rec/en_PP-OCRv4_rec_mobile/en_dict.txt"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SOURCE_COMMIT }}

      - name: Verify exact evidence source checkout
        run: test "$(git rev-parse HEAD)" = "${EVIDENCE_SOURCE_COMMIT}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Create isolated Docling environment
        run: |
          python -m venv "${RUNNER_TEMP}/docling-venv"
          "${RUNNER_TEMP}/docling-venv/bin/python" -m pip --version \
            | tee "${RUNNER_TEMP}/docling-pip-version.txt"

      - name: Install pinned Docling environment
        run: |
          mkdir -p "${RUNNER_TEMP}/docling-wheel"
          "${RUNNER_TEMP}/docling-venv/bin/python" -m pip download \
            --no-deps --only-binary=:all: \
            --dest "${RUNNER_TEMP}/docling-wheel" \
            "docling==${DOCLING_VERSION}"
          WHEEL="$(find "${RUNNER_TEMP}/docling-wheel" -maxdepth 1 -type f -name 'docling-*.whl' -print -quit)"
          test -n "${WHEEL}"
          echo "${DOCLING_WHEEL_SHA256}  ${WHEEL}" | sha256sum -c -
          "${RUNNER_TEMP}/docling-venv/bin/python" -m pip install \
            --constraint "${DOCLING_CONSTRAINTS}" \
            "${WHEEL}"
          "${RUNNER_TEMP}/docling-venv/bin/python" -m pip check
          "${RUNNER_TEMP}/docling-venv/bin/python" -c \
            'import importlib.metadata as m; assert m.version("docling") == "2.118.0"; assert m.version("rapidocr") == "3.9.2"; print(m.version("docling"), m.version("rapidocr"))'

      - name: Prefetch and verify pinned Docling layout payload
        run: |
          mkdir -p "${RUNNER_TEMP}/docling-models"
          "${RUNNER_TEMP}/docling-venv/bin/docling-tools" models download \
            --quiet \
            --output-dir "${RUNNER_TEMP}/docling-models" \
            layout \
            | tee "${RUNNER_TEMP}/docling-model-download.txt"
          "${RUNNER_TEMP}/docling-venv/bin/python" elaboration/p0/benchmark/routes/verify_docling_reference.py \
            --constraints "${DOCLING_CONSTRAINTS}" \
            --model-lock "${DOCLING_MODEL_LOCK}" \
            --artifacts-path "${RUNNER_TEMP}/docling-models" \
            --output "${RUNNER_TEMP}/docling-reference-verification.json"

      - name: Materialize versioned RapidOCR English Torch payload
        run: |
          PAYLOAD="${RUNNER_TEMP}/rapidocr-payload"
          mkdir -p "${PAYLOAD}"
          curl --fail --location --retry 3 --retry-delay 2 \
            "${RAPIDOCR_DET_URL}" --output "${PAYLOAD}/en_PP-OCRv3_det_mobile.pth"
          curl --fail --location --retry 3 --retry-delay 2 \
            "${RAPIDOCR_REC_URL}" --output "${PAYLOAD}/en_PP-OCRv4_rec_mobile.pth"
          curl --fail --location --retry 3 --retry-delay 2 \
            "${RAPIDOCR_DICT_URL}" --output "${PAYLOAD}/en_dict.txt"
          echo "${RAPIDOCR_DET_SHA256}  ${PAYLOAD}/en_PP-OCRv3_det_mobile.pth" | sha256sum -c -
          echo "${RAPIDOCR_REC_SHA256}  ${PAYLOAD}/en_PP-OCRv4_rec_mobile.pth" | sha256sum -c -
          test -s "${PAYLOAD}/en_dict.txt"
          sha256sum "${PAYLOAD}"/* | tee "${RUNNER_TEMP}/rapidocr-payload-sha256.txt"

      - name: Run exploratory Docling RapidOCR profile
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
        run: |
          OUT="${RUNNER_TEMP}/raiatea-b01-rapidocr-exploratory"
          CACHE="${RUNNER_TEMP}/rapidocr-measured-cache"
          PAYLOAD="${RUNNER_TEMP}/rapidocr-payload"
          mkdir -p "${OUT}" "${CACHE}"
          "${RUNNER_TEMP}/docling-venv/bin/python" elaboration/p0/benchmark/routes/measure_b01_docling_rapidocr_exploratory.py \
            --output "${OUT}" \
            --artifacts-path "${RUNNER_TEMP}/docling-models" \
            --cache-root "${CACHE}" \
            --det-model "${PAYLOAD}/en_PP-OCRv3_det_mobile.pth" \
            --rec-model "${PAYLOAD}/en_PP-OCRv4_rec_mobile.pth" \
            --rec-keys "${PAYLOAD}/en_dict.txt" \
            --evidence-source-commit "${EVIDENCE_SOURCE_COMMIT}" \
            > "${OUT}/stdout-report.json"
          test -s "${OUT}/b01-docling-rapidocr-exploratory.json"
          test -s "${OUT}/rapidocr-payload-evidence.json"
          test -s "${OUT}/raw/B01-PDF-007__docling-rapidocr.json"
          test -s "${OUT}/observations/B01-PDF-007__docling-rapidocr.json"

      - name: Upload exploratory evidence (models excluded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-b01-rapidocr-exploratory-${{ env.EVIDENCE_SOURCE_COMMIT }}
          path: |
            ${{ runner.temp }}/raiatea-b01-rapidocr-exploratory
            ${{ runner.temp }}/rapidocr-payload-sha256.txt
            ${{ runner.temp }}/docling-reference-verification.json
            ${{ runner.temp }}/docling-pip-version.txt
            ${{ runner.temp }}/docling-model-download.txt
          if-no-files-found: warn
          retention-days: 7
