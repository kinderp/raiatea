name: VS1e deterministic search Views and Smart Collections

on:
  pull_request:
    paths:
      - "prototype/p0_vs1/**"
      - ".github/workflows/vs1e-search-views.yml"
      - "elaboration/p0/gates/g06/**"
  push:
    branches: [main]
    paths:
      - "prototype/p0_vs1/**"
      - ".github/workflows/vs1e-search-views.yml"

permissions:
  contents: read

jobs:
  vs1e:
    name: VS1e / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile VS1e and accepted G-06 proof
        run: >-
          python -m compileall -q
          prototype/p0_vs1
          elaboration/p0/gates/g06
      - name: Run VS1e product search tests
        run: |
          python -m unittest prototype.p0_vs1.test_vs1e -v
          python -m unittest prototype.p0_vs1.test_vs1e_snapshot_consistency -v
          python -m unittest prototype.p0_vs1.test_vs1e_query_hardening -v
      - name: Re-run accepted G-06 deterministic proof
        working-directory: elaboration/p0/gates/g06
        run: python -m unittest test_search_view_proof.py -v
