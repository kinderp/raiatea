name: GUI AppShell

on:
  pull_request:
    paths:
      - "frontend/**"
      - "adr/0003-gui-renderer-stack.md"
      - ".github/workflows/gui-app-shell.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "adr/0003-gui-renderer-stack.md"
      - ".github/workflows/gui-app-shell.yml"

permissions:
  contents: read

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ${{ hashFiles('frontend/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --ignore-scripts
          fi
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test gateway and panel contracts
        working-directory: frontend
        run: npm test
      - name: Build production renderer
        working-directory: frontend
        run: npm run build
      - name: Upload dependency lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: gui-app-shell-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
