name: Tauri demo lock bootstrap

on:
  push:
    branches: [feature/tauri-live-demo]
    paths:
      - "frontend/package.json"
      - "frontend/src-tauri/Cargo.toml"
      - ".github/workflows/tauri-demo-lock-bootstrap.yml"

permissions:
  contents: read

jobs:
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve exact npm lock
        working-directory: frontend
        run: npm install --ignore-scripts
      - name: Resolve exact Cargo lock
        working-directory: frontend/src-tauri
        run: cargo generate-lockfile
      - name: Upload lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: tauri-demo-lockfiles
          path: |
            frontend/package-lock.json
            frontend/src-tauri/Cargo.lock
          if-no-files-found: error
