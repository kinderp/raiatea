name: GUI AppShell

on:
  pull_request:
    paths:
      - "frontend/**"
      - "adr/0003-gui-renderer-stack.md"
      - ".github/workflows/gui-app-shell.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "adr/0003-gui-renderer-stack.md"
      - ".github/workflows/gui-app-shell.yml"

permissions:
  contents: read

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies from lock
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test gateway and panel contracts
        working-directory: frontend
        run: npm test
      - name: Build production renderer
        working-directory: frontend
        run: npm run build
