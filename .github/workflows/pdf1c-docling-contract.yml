name: PDF1c Docling observation contract

on:
  pull_request:
    paths:
      - "prototype/p0_vs1/docling_observation_contract.py"
      - "prototype/p0_vs1/test_pdf1c_contract.py"
      - ".github/workflows/pdf1c-docling-contract.yml"
  push:
    branches: [main]
    paths:
      - "prototype/p0_vs1/docling_observation_contract.py"
      - "prototype/p0_vs1/test_pdf1c_contract.py"
      - ".github/workflows/pdf1c-docling-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    name: PDF1c contract / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile contract
        run: python -m compileall -q prototype/p0_vs1/docling_observation_contract.py prototype/p0_vs1/test_pdf1c_contract.py
      - name: Run PDF1c contract tests
        run: python -m unittest prototype.p0_vs1.test_pdf1c_contract -v
