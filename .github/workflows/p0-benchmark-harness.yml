name: P0 benchmark harness

on:
  pull_request:
    paths:
      - "elaboration/p0/benchmark/**"
      - ".github/workflows/p0-benchmark-harness.yml"
  push:
    branches:
      - main
    paths:
      - "elaboration/p0/benchmark/**"
      - ".github/workflows/p0-benchmark-harness.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile benchmark tooling
        shell: bash
        run: python -m compileall -q elaboration/p0/benchmark

      - name: Run benchmark harness tests
        shell: bash
        run: python -m unittest discover -s elaboration/p0/benchmark/tests -v

      - name: Generate deterministic fixture set
        shell: bash
        run: |
          python elaboration/p0/benchmark/generate_fixtures.py \
            --output "${RUNNER_TEMP}/raiatea-p0-fixtures" > "${RUNNER_TEMP}/raiatea-p0-generated-manifest.txt"
          test -s "${RUNNER_TEMP}/raiatea-p0-fixtures/generated-manifest.json"

  b01-poppler-reference:
    name: B-01 Poppler reference / Ubuntu 24.04
    needs: test
    runs-on: ubuntu-24.04
    env:
      EVIDENCE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_POPPLER_VERSION: "24.02.0"
      EXPECTED_PDFTOTEXT_SHA256: "0fb98ea179e19154a90202608c164f2a319b79f16576fa6534b2d601033565e7"
      EXPECTED_PDFTOHTML_SHA256: "70bd5fbb655a14d0b02cb32cb53a601d3b0842a63553a24d1a6a612cf9f0624e"
      EXPECTED_PDFINFO_SHA256: "3293dda06d80e1e38dab859aa47368c2876aedc41cbc2e24e8fb9a4e66392078"

    steps:
      - name: Check out exact evidence source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SOURCE_COMMIT }}

      - name: Verify evidence source checkout
        run: |
          test "$(git rev-parse HEAD)" = "${EVIDENCE_SOURCE_COMMIT}"
          echo "Evidence source commit: ${EVIDENCE_SOURCE_COMMIT}"

      - name: Set up exact reference Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install and verify exact Poppler controls
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

          pdftotext -v 2>&1 | head -1 | grep -F "version ${EXPECTED_POPPLER_VERSION}"
          pdftohtml -v 2>&1 | head -1 | grep -F "version ${EXPECTED_POPPLER_VERSION}"
          pdfinfo -v 2>&1 | head -1 | grep -F "version ${EXPECTED_POPPLER_VERSION}"

          echo "${EXPECTED_PDFTOTEXT_SHA256}  /usr/bin/pdftotext" | sha256sum -c -
          echo "${EXPECTED_PDFTOHTML_SHA256}  /usr/bin/pdftohtml" | sha256sum -c -
          echo "${EXPECTED_PDFINFO_SHA256}  /usr/bin/pdfinfo" | sha256sum -c -

      - name: Run B-01 reference baseline
        run: |
          mkdir -p "${RUNNER_TEMP}/raiatea-b01-reference"
          python elaboration/p0/benchmark/routes/measure_b01.py \
            --output "${RUNNER_TEMP}/raiatea-b01-reference" \
            --evidence-source-commit "${EVIDENCE_SOURCE_COMMIT}" \
            > "${RUNNER_TEMP}/raiatea-b01-reference/stdout-report.json"
          test -s "${RUNNER_TEMP}/raiatea-b01-reference/b01-results.json"
          test -s "${RUNNER_TEMP}/raiatea-b01-reference/b01-summary.md"

      - name: Upload B-01 reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-b01-poppler-reference-${{ env.EVIDENCE_SOURCE_COMMIT }}
          path: ${{ runner.temp }}/raiatea-b01-reference
          if-no-files-found: error
          retention-days: 7

  b01-tika-reference:
    name: B-01 Tika 3.3.2 reference / Ubuntu 24.04
    needs: test
    runs-on: ubuntu-24.04
    env:
      EVIDENCE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      TIKA_VERSION: "3.3.2"
      TIKA_SHA512: "88c2032cba0d45feea361e6eebd2918bd04707614cdda5d89a1b167da5503c98e7b4cd368336f0402d559abcaf5006fcc7c825c32c749ae0417ea2f3b8423aba"
      TIKA_URL: "https://downloads.apache.org/tika/3.3.2/tika-app-3.3.2.jar"
      EXPECTED_JAVA_SHA256: "11af352aa2c506c4123a4e4c19c187d59e06cd0dff317d54f5e6806e07c6715d"

    steps:
      - name: Check out exact evidence source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SOURCE_COMMIT }}

      - name: Verify evidence source checkout
        run: |
          test "$(git rev-parse HEAD)" = "${EVIDENCE_SOURCE_COMMIT}"
          echo "Evidence source commit: ${EVIDENCE_SOURCE_COMMIT}"

      - name: Set up reference Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Set up exact reference Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.12+8"

      - name: Verify exact Java runtime
        run: |
          java -version 2>&1 | head -1 | grep -F '21.0.12'
          JAVA_BIN="$(command -v java)"
          echo "${EXPECTED_JAVA_SHA256}  ${JAVA_BIN}" | sha256sum -c -

      - name: Download and verify official Tika app
        run: |
          mkdir -p "${RUNNER_TEMP}/raiatea-tika"
          curl --fail --location --retry 3 --retry-delay 2 \
            "${TIKA_URL}" \
            --output "${RUNNER_TEMP}/raiatea-tika/tika-app-${TIKA_VERSION}.jar"
          echo "${TIKA_SHA512}  ${RUNNER_TEMP}/raiatea-tika/tika-app-${TIKA_VERSION}.jar" | sha512sum -c -
          java -jar "${RUNNER_TEMP}/raiatea-tika/tika-app-${TIKA_VERSION}.jar" -V 2>&1 | tee "${RUNNER_TEMP}/raiatea-tika/tika-version.txt"
          grep -F "${TIKA_VERSION}" "${RUNNER_TEMP}/raiatea-tika/tika-version.txt"

      - name: Run Tika B-01 reference baseline
        run: |
          mkdir -p "${RUNNER_TEMP}/raiatea-tika-reference"
          python elaboration/p0/benchmark/routes/measure_tika_b01.py \
            --output "${RUNNER_TEMP}/raiatea-tika-reference" \
            --tika-jar "${RUNNER_TEMP}/raiatea-tika/tika-app-${TIKA_VERSION}.jar" \
            --config elaboration/p0/benchmark/config/tika-pdf-native-no-ocr.xml \
            --evidence-source-commit "${EVIDENCE_SOURCE_COMMIT}" \
            > "${RUNNER_TEMP}/raiatea-tika-reference/stdout-report.json"
          test -s "${RUNNER_TEMP}/raiatea-tika-reference/tika-b01-results.json"
          test -s "${RUNNER_TEMP}/raiatea-tika-reference/tika-b01-summary.md"

      - name: Upload Tika B-01 reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-b01-tika-${{ env.TIKA_VERSION }}-${{ env.EVIDENCE_SOURCE_COMMIT }}
          path: |
            ${{ runner.temp }}/raiatea-tika-reference
            ${{ runner.temp }}/raiatea-tika/tika-version.txt
          if-no-files-found: error
          retention-days: 7
